<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SOUND METER AMDA AUDIO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2d9e">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f6;font-family:monospace;display:flex;flex-direction:column;height:100vh}
header{text-align:center;padding:12px;border-bottom:2px solid #00ff88;font-weight:bold;font-size:18px;color:#00ff88}
#dbBig{background:#0a0a0a;text-align:center;padding:12px;border:1px solid #222;margin:8px;border-radius:10px}
#dbNum{font-size:48px;color:#00ff88;font-weight:bold}
#peak{font-size:13px;color:#aaa;margin-top:4px}
#wrap{display:flex;flex:1;overflow:hidden}
#dbScale{display:flex;flex-direction:column;justify-content:space-between;padding:10px 4px 30px 8px;font-size:11px;color:#888;text-align:right;width:50px}
#canvasBox{flex:1;position:relative}
canvas{width:100%;height:100%;background:#050505;border-left:1px solid #222}
#freqLabel{display:flex;justify-content:space-between;padding:3px 6px;font-size:10px;color:#777}
#ctrl{display:flex;gap:10px;padding:12px;justify-content:center;background:#111;border-top:1px solid #222}
button{padding:14px 18px;border:none;border-radius:12px;font-weight:bold;font-size:14px;flex:1}
#micBtn{background:#00ff88;color:#000}
#micBtn.stop{background:#111;color:#ff4444;border:2px solid #ff4444}
#pinkBtn{background:#111;color:#ff4444;border:2px solid #ff4444}
#pinkBtn.playing{background:#ff2d9e;color:#fff;border:none;box-shadow:0 0 15px #ff2d9e}
footer{text-align:center;padding:6px;font-size:10px;color:#555}
</style>
</head>
<body>
<header>🎤 SOUND METER AMDA AUDIO</header>

<div id="dbBig">
  <div id="dbNum">--.- dB SPL</div>
  <div id="peak">PEAK HOLD: --.- dB • TAP TO RESET</div>
</div>

<div id="wrap">
  <div id="dbScale"><span>0 dB</span><span>-10 dB</span><span>-20 dB</span><span>-30 dB</span><span>-40 dB</span><span>-50 dB</span><span>-60 dB</span></div>
  <div id="canvasBox"><canvas id="c"></canvas></div>
</div>
<div id="freqLabel"><span>20Hz</span><span>100Hz</span><span>500Hz</span><span style="color:#00ff88">1kHz</span><span>5kHz</span><span>10kHz</span><span>20kHz</span></div>

<div id="ctrl">
  <button id="micBtn">🎙️ START MIC</button>
  <button id="pinkBtn">🔊 PLAY PINK NOISE</button>
</div>
<footer>AMDA AUDIO BANGOREJO • OFFLINE MODE READY ✓ • PINK=MATI MERAH</footer>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),dbNum=document.getElementById('dbNum'),peakEl=document.getElementById('peak');
let audioCtx,analyser,mic,anim,peak=0;
function resize(){canvas.width=canvas.clientWidth*2;canvas.height=canvas.clientHeight*2}
window.addEventListener('resize',resize);resize();
peakEl.onclick=()=>{peak=0};

async function startMic(){
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0.8;
 try{
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 mic=audioCtx.createMediaStreamSource(stream);mic.connect(analyser);
 draw();micBtn.textContent='🟧 STOP MIC';micBtn.classList.add('stop');
 }catch(e){dbNum.textContent='MIC DITOLAK BOS';}
}
function draw(){
 anim=requestAnimationFrame(draw);
 const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);
 const timeData=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(timeData);
 let sum=0;for(let i=0;i<timeData.length;i++){let v=(timeData[i]-128)/128;sum+=v*v}let rms=Math.sqrt(sum/timeData.length);
 let db=20*Math.log10(rms||0.00001)+100;if(db<0)db=0;if(db>peak)peak=db;
 dbNum.textContent=db.toFixed(1)+' dB SPL';peakEl.textContent=`PEAK HOLD: ${peak.toFixed(1)} dB • TAP TO RESET`;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 const barW=canvas.width/data.length*2.2;let x=0;
 for(let i=0;i<data.length;i++){let h=data[i]/255*canvas.height;let green=`hsl(${120-(h/canvas.height*60)},100%,50%)`;
 ctx.fillStyle=green;ctx.fillRect(x,canvas.height-h,barW-1,h);x+=barW}
}
const micBtn=document.getElementById('micBtn');
micBtn.onclick=()=>{
 if(anim){cancelAnimationFrame(anim);anim=null;if(audioCtx)audioCtx.close();audioCtx=null;dbNum.textContent='--.- dB SPL';micBtn.textContent='🎙️ START MIC';micBtn.classList.remove('stop');}
 else{startMic();}
};

let pinkNode=null;const pBtn=document.getElementById('pinkBtn');
pBtn.onclick=()=>{
 if(pinkNode){
   pinkNode.stop();pinkNode=null;
   pBtn.textContent='🔊 PLAY PINK NOISE';
   pBtn.classList.remove('playing');
   return
 }
 if(!audioCtx)audioCtx=new AudioContext();
 const bufferSize=audioCtx.sampleRate*2;const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);let d=buffer.getChannelData(0);
 for(let i=0;i<bufferSize;i++) d[i]=(Math.random()*2-1)*0.3;
 pinkNode=audioCtx.createBufferSource();pinkNode.buffer=buffer;pinkNode.loop=true;pinkNode.connect(audioCtx.destination);pinkNode.start();
 pBtn.textContent='⏹️ STOP NOISE';
 pBtn.classList.add('playing');
};
startMic();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
