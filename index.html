<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SOUND METER AMDA AUDIO - PINK EDITION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f6;font-family:monospace;display:flex;flex-direction:column;height:100vh}
header{text-align:center;padding:12px;border-bottom:2px solid #00ff88;font-weight:bold;color:#00ff88}
#dbBig{background:#0a0a0a;text-align:center;padding:14px;border:1px solid #222;margin:8px;border-radius:10px}
#dbNum{font-size:42px;color:#00ff88;font-weight:bold}
#peak{font-size:12px;color:#aaa;margin-top:4px}
#wrap{display:flex;flex:1;overflow:hidden}
#dbScale{display:flex;flex-direction:column;justify-content:space-between;padding:10px 4px 30px 8px;font-size:11px;color:#888;width:50px;text-align:right}
#canvasBox{flex:1}
canvas{width:100%;height:100%;background:#050505;border-left:1px solid #222}
#freqLabel{display:flex;justify-content:space-between;padding:3px 6px;font-size:10px;color:#777}
#ctrl{display:flex;gap:10px;padding:12px;justify-content:center;background:#111;border-top:1px solid #222}
button{padding:16px;border:none;border-radius:14px;font-weight:bold;font-size:14px;flex:1}
#micBtn{background:#00ff88;color:#000}
#micBtn.stop{background:#111;color:#ff4444;border:2px solid #ff4444}
#pinkBtn{background:#111;color:#ff4444;border:2px solid #ff4444}
#pinkBtn.playing{background:#ff2d9e;color:#fff;box-shadow:0 0 20px #ff2d9e;border:none}
footer{text-align:center;padding:6px;font-size:10px;color:#555}
</style>
</head>
<body>
<header>🎤 SOUND METER AMDA AUDIO • PINK EDITION</header>
<div id="dbBig"><div id="dbNum">--.- dB SPL</div><div id="peak">PEAK: --.- dB • TAP RESET</div></div>
<div id="wrap"><div id="dbScale"><span>0</span><span>-10</span><span>-20</span><span>-30</span><span>-40</span><span>-50</span><span>-60</span></div><div id="canvasBox"><canvas id="c"></canvas></div></div>
<div id="freqLabel"><span>20Hz</span><span>1kHz</span><span>20kHz</span></div>
<div id="ctrl">
<button id="micBtn">🎙️ START MIC</button>
<button id="pinkBtn">🔴 PLAY PINK NOISE</button>
</div>
<footer>AMDA AUDIO BANGOREJO • MERAH=MATI • PINK=NYALA</footer>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),dbNum=document.getElementById('dbNum'),peakEl=document.getElementById('peak');
let audioCtx,analyser,anim,peak=0;
function resize(){canvas.width=canvas.clientWidth*2;canvas.height=canvas.clientHeight*2}
window.addEventListener('resize',resize);resize();
peakEl.onclick=()=>{peak=0};
async function startMic(){
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0.8;
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 audioCtx.createMediaStreamSource(stream).connect(analyser);draw();
 micBtn.textContent='🟧 STOP MIC';micBtn.classList.add('stop');
}
function draw(){
 anim=requestAnimationFrame(draw);
 const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);
 const tData=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(tData);
 let sum=0;for(let i=0;i<tData.length;i++){let v=(tData[i]-128)/128;sum+=v*v}let rms=Math.sqrt(sum/tData.length);
 let db=20*Math.log10(rms||0.00001)+100;if(db<0)db=0;if(db>peak)peak=db;
 dbNum.textContent=db.toFixed(1)+' dB SPL';peakEl.textContent=`PEAK: ${peak.toFixed(1)} dB • TAP RESET`;
 ctx.clearRect(0,0,canvas.width,canvas.height);const barW=canvas.width/data.length*2.2;let x=0;
 for(let i=0;i<data.length;i++){let h=data[i]/255*canvas.height;ctx.fillStyle=`hsl(${120-h/canvas.height*60},100%,50%)`;ctx.fillRect(x,canvas.height-h,barW-1,h);x+=barW}
}
const micBtn=document.getElementById('micBtn');
micBtn.onclick=()=>{if(anim){cancelAnimationFrame(anim);anim=null;if(audioCtx)audioCtx.close();audioCtx=null;dbNum.textContent='--.- dB SPL';micBtn.textContent='🎙️ START MIC';micBtn.classList.remove('stop');}else{startMic();}};
let pinkNode=null;const pBtn=document.getElementById('pinkBtn');
pBtn.onclick=()=>{
 if(pinkNode){pinkNode.stop();pinkNode=null;pBtn.textContent='🔴 PLAY PINK NOISE';pBtn.classList.remove('playing');return}
 if(!audioCtx)audioCtx=new AudioContext();
 const bufferSize=audioCtx.sampleRate*2;const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);let d=buffer.getChannelData(0);
 for(let i=0;i<bufferSize;i++) d[i]=(Math.random()*2-1)*0.3;
 pinkNode=audioCtx.createBufferSource();pinkNode.buffer=buffer;pinkNode.loop=true;pinkNode.connect(audioCtx.destination);pinkNode.start();
 pBtn.textContent='💖 STOP NOISE';pBtn.classList.add('playing');
};
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));caches.keys().then(k=>k.forEach(x=>caches.delete(x)))}
</script>
</body>
</html>
