<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>AMDA AUDIO - SOUND METER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100dvh;background:#000;overflow:hidden}
body{display:flex;flex-direction:column;font-family:monospace;color:#00ff88}
header{text-align:center;padding:8px;font-size:12px;font-weight:bold;color:#00ff88;border-bottom:1px solid #151515;letter-spacing:1px}
#dbBig{background:#0f0f0f;text-align:center;padding:8px 0 6px;border:1px solid #1e1e1e;margin:6px 6px 0;border-radius:10px;flex-shrink:0}
#dbNum{font-size:30px;font-weight:900;color:#ffffff;text-shadow:0 0 14px rgba(255,255,255,0.7);letter-spacing:0.5px;line-height:1.1}
#peak{font-size:10px;color:#bbbbbb;margin-top:2px;letter-spacing:0.5px}
#wrap{flex:1;display:flex;min-height:0;margin-top:2px}
#dbScale{display:flex;flex-direction:column;justify-content:space-between;padding:6px 2px 24px 5px;font-size:10px;color:#555;width:32px;text-align:right;flex-shrink:0}
#canvasBox{flex:1;min-width:0}
canvas{width:100%;height:100%;background:#000;display:block}
#freqLabel{display:flex;justify-content:space-between;padding:3px 8px 4px 40px;font-size:9px;color:#444;flex-shrink:0}
#ctrl{display:flex;gap:8px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:#0a0a0a;border-top:1px solid #1a1a1a;flex-shrink:0}
button{flex:1;padding:11px 6px;border-radius:10px;font-weight:bold;font-size:11px;min-width:0;white-space:nowrap}
#micBtn{background:#111;color:#ff3b3b;border:1.5px solid #ff3b3b}
#micBtn.stop{background:#222;color:#ff3b3b}
#pinkBtn{background:#111;color:#ff3b3b;border:1.5px solid #ff3b3b}
#pinkBtn.playing{background:#ff1493;color:#fff;border-color:#ff1493;box-shadow:0 0 18px #ff1493}
footer{text-align:center;padding:3px;font-size:8px;color:#333;flex-shrink:0}
</style>
</head>
<body>
<header>.::SOUND METER AMDA AUDIO::.</header>
<div id="dbBig"><div id="dbNum">--.- dB SPL</div><div id="peak">PEAK: --.- dB • TAP RESET</div></div>
<div id="wrap"><div id="dbScale"><span>0</span><span>-10</span><span>-20</span><span>-30</span><span>-40</span><span>-50</span><span>-60</span></div><div id="canvasBox"><canvas id="c"></canvas></div></div>
<div id="freqLabel"><span>20Hz</span><span>1kHz</span><span>20kHz</span></div>
<div id="ctrl">
<button id="micBtn">🟧 START MIC</button>
<button id="pinkBtn">🔴 PLAY PINK NOISE</button>
</div>
<footer>AMDA AUDIO BWI</footer>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),dbNum=document.getElementById('dbNum'),peakEl=document.getElementById('peak');
let audioCtx,analyser,anim,peak=0;
function resize(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio}
addEventListener('resize',resize);resize();
peakEl.onclick=()=>{peak=0};
async function startMic(){
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 analyser=audioCtx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0.85;
 const s=await navigator.mediaDevices.getUserMedia({audio:true});
 audioCtx.createMediaStreamSource(s).connect(analyser);draw();
 micBtn.textContent='🟧 STOP MIC';micBtn.classList.add('stop');
}
function draw(){
 anim=requestAnimationFrame(draw);
 const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);
 const tData=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(tData);
 let sum=0;for(let i=0;i<tData.length;i++){let v=(tData[i]-128)/128;sum+=v*v}let rms=Math.sqrt(sum/tData.length);
 let db=20*Math.log10(rms||0.00001)+100;if(db<0)db=0;if(db>peak)peak=db;
 dbNum.textContent=db.toFixed(1)+' dB SPL';peakEl.textContent=`PEAK: ${peak.toFixed(1)} dB • TAP RESET`;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 const barW=canvas.width/data.length*1.8;let x=0;
 for(let i=0;i<data.length;i++){let v=data[i];if(v<3)continue;let h=v/255*canvas.height;
 let col=v>180?'#00ff88':v>100?'#88ff00':'#00cc44';
 ctx.fillStyle=col;ctx.fillRect(x,canvas.height-h,barW,h);x+=barW+0.5}
}
const micBtn=document.getElementById('micBtn');
micBtn.onclick=()=>{if(anim){cancelAnimationFrame(anim);anim=null;if(audioCtx)audioCtx.close();audioCtx=null;dbNum.textContent='--.- dB SPL';micBtn.textContent='🟧 START MIC';micBtn.classList.remove('stop');}else{startMic();}};
let pinkNode=null;const pBtn=document.getElementById('pinkBtn');
pBtn.onclick=()=>{
 if(pinkNode){pinkNode.stop();pinkNode=null;pBtn.textContent='🔴 PLAY PINK NOISE';pBtn.classList.remove('playing');return}
 if(!audioCtx)audioCtx=new AudioContext();
 const sz=audioCtx.sampleRate*2;const buf=audioCtx.createBuffer(1,sz,audioCtx.sampleRate);let d=buf.getChannelData(0);
 for(let i=0;i<sz;i++) d[i]=(Math.random()*2-1)*0.35;
 pinkNode=audioCtx.createBufferSource();pinkNode.buffer=buf;pinkNode.loop=true;pinkNode.connect(audioCtx.destination);pinkNode.start();
 pBtn.textContent='💖 STOP NOISE';pBtn.classList.add('playing');
};
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));caches.keys().then(k=>k.forEach(x=>caches.delete(x)))}
</script>
</body>
</html>
