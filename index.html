<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUND METER AMDA AUDIO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff88">
<style>
body{margin:0;background:#000;color:#00ff88;font-family:monospace;overflow:hidden}
h1{margin:0;padding:12px;text-align:center;border-bottom:2px solid #00ff88;font-size:18px}
.tabs{display:flex;border-bottom:1px solid #222}
.tab{flex:1;padding:12px;text-align:center;color:#555;cursor:pointer;font-weight:bold}
.tab.active{color:#00ff88;border-bottom:3px solid #00ff88}
#canvas{width:100%;height:45vh;background:#111;display:block}
.controls{padding:12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{padding:14px 20px;background:#00ff88;color:#000;border:none;font-weight:bold;border-radius:8px;font-size:14px;cursor:pointer}
.info{text-align:center;color:#888;font-size:12px;padding:6px}
</style>
</head>
<body>
<h1>🎤 SOUND METER AMDA AUDIO ✓</h1>
<div class="tabs">
<div class="tab active">MAGNITUDE (RTA)</div>
<div class="tab">PHASE</div>
<div class="tab">IMPULSE</div>
</div>
<canvas id="canvas"></canvas>
<div class="controls">
<button id="btnMic">🎙️ START MIC</button>
<button id="btnNoise">🔊 PLAY PINK NOISE</button>
</div>
<div class="info">AMDA AUDIO BANGOREJO • OFFLINE MODE READY ✓</div>
<script>
const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.clientWidth*2;canvas.height=canvas.clientHeight*2;}resize();
let audioCtx,analyser,dataArray,source,noiseNode;let isMic=false;
function draw(){requestAnimationFrame(draw);if(!analyser) return;analyser.getByteFrequencyData(dataArray);ctx.fillStyle='#111';ctx.fillRect(0,0,canvas.width,canvas.height);const barWidth=canvas.width/dataArray.length*2.5;let x=0;for(let i=0;i<dataArray.length;i++){const barHeight=dataArray[i]*2;ctx.fillStyle=i<20?'#00ff88':i<60?'#88ff00':'#ffaa00';ctx.fillRect(x,canvas.height-barHeight,barWidth,barHeight);x+=barWidth+1;}ctx.fillStyle='#333';ctx.font='20px monospace';ctx.fillText('20Hz',10,canvas.height-10);ctx.fillText('1kHz',canvas.width/2-30,canvas.height-10);ctx.fillText('20kHz',canvas.width-100,canvas.height-10);}draw();
async function startMic(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const stream=await navigator.mediaDevices.getUserMedia({audio:true});analyser=audioCtx.createAnalyser();analyser.fftSize=256;dataArray=new Uint8Array(analyser.frequencyBinCount);source=audioCtx.createMediaStreamSource(stream);source.connect(analyser);isMic=true;document.getElementById('btnMic').innerText='⏹️ STOP MIC';}catch(e){alert('Mic error bos: '+e.message)}}function stopMic(){if(audioCtx) audioCtx.close();analyser=null;isMic=false;document.getElementById('btnMic').innerText='🎙️ START MIC';}
document.getElementById('btnMic').onclick=()=>{isMic?stopMic():startMic();};
document.getElementById('btnNoise').onclick=async()=>{if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(noiseNode){noiseNode.stop();noiseNode=null;document.getElementById('btnNoise').innerText='🔊 PLAY PINK NOISE';return;}const bufferSize=audioCtx.sampleRate*2;const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);const output=buffer.getChannelData(0);let b0,b1,b2,b3,b4,b5,b6;b0=b1=b2=b3=b4=b5=b6=0;for(let i=0;i<bufferSize;i++){const white=Math.random()*2-1;b0=0.99886*b0+white*0.0555179;b1=0.99332*b1+white*0.0750759;b2=0.96900*b2+white*0.1538520;b3=0.86650*b3+white*0.3104856;b4=0.55000*b4+white*0.5329522;b5=-0.7616*b5-white*0.0168980;output[i]=(b0+b1+b2+b3+b4+b5+b6+white*0.5362)*0.11;b6=white*0.115926;}noiseNode=audioCtx.createBufferSource();noiseNode.buffer=buffer;noiseNode.loop=true;analyser=audioCtx.createAnalyser();analyser.fftSize=256;dataArray=new Uint8Array(analyser.frequencyBinCount);noiseNode.connect(analyser);noiseNode.connect(audioCtx.destination);noiseNode.start();document.getElementById('btnNoise').innerText='⏹️ STOP NOISE';};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>console.log('SW Ready'));}
</script>
</body>
</html>
