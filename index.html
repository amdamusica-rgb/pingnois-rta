<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PINK + MIC RTA</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center}
h1{color:#ff0066;margin:15px 0 0}canvas{width:100%;height:65vh;background:#111;display:block}
button{padding:12px 24px;border-radius:30px;border:0;font-weight:bold;margin:6px}
.pink{background:#ff0066;color:#fff}.mic{background:#00ff88;color:#000}.stop{background:#333;color:#fff}
.active{outline:3px solid #fff}</style></head>
<body>
<h1>PINK NOISE + RTA</h1>
<p id="mode">MODE: IDLE</p>
<button class="pink" id="bPink" onclick="modePink()">▶ PINK NOISE</button>
<button class="mic" id="bMic" onclick="modeMic()">🎤 MIC RTA</button>
<button class="stop" onclick="stopAll()">■ STOP</button><br>
VOL <input type="range" id="vol" value="35" oninput="document.getElementById('vt').innerText=this.value+'%'"><span id="vt">35%</span>
<canvas id="c"></canvas>
<script>
let ac,src,g,an,ok=false;let c=document.getElementById('c'),x=c.getContext('2d');
function sz(){c.width=innerWidth*2;c.height=innerHeight}sz();window.addEventListener('resize',sz);
function pinkBuf(a){let l=a.sampleRate*4,b=a.createBuffer(1,l,a.sampleRate),d=b.getChannelData(0),b0=b1=b2=b3=b4=b5=b6=0;for(let i=0;i<l;i++){let w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.969*b2+w*0.153852;b3=0.8665*b3+w*0.3104856;b4=0.55*b4+w*0.5329522;b5=-0.7616*b5-w*0.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926}return b}
async function modeMic(){
 stopAll();document.getElementById('mode').innerText='MODE: MIC RTA - DENGAR DARI SPEAKER';document.getElementById('bMic').classList.add('active');
 try{
  if(!ac)ac=new(window.AudioContext||webkitAudioContext)();
  let stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,autoGainControl:false,noiseSuppression:false}});
  src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0.7;
  src.connect(an);ok=true;loop();
 }catch(e){alert('Mic gagal bos, allow mic dulu: '+e)}
}
function modePink(){
 stopAll();document.getElementById('mode').innerText='MODE: PLAY PINK NOISE - OUTPUT KE MIXER';document.getElementById('bPink').classList.add('active');
 if(!ac)ac=new(window.AudioContext||webkitAudioContext)();let b=pinkBuf(ac);src=ac.createBufferSource();src.buffer=b;src.loop=true;
 g=ac.createGain();g.gain.value=document.getElementById('vol').value/100*0.5;an=ac.createAnalyser();an.fftSize=2048;
 src.connect(g);g.connect(an);an.connect(ac.destination);src.start();ok=true;loop();
}
function stopAll(){ok=false;if(src)try{src.mediaStream&&src.mediaStream.getTracks().forEach(t=>t.stop());src.stop&&src.stop()}catch(e){}document.getElementById('bPink').classList.remove('active');document.getElementById('bMic').classList.remove('active');document.getElementById('mode').innerText='MODE: STOP';x.clearRect(0,0,c.width,c.height)}
function loop(){let fd=new Uint8Array(an.frequencyBinCount);(function f(){if(!ok)return;requestAnimationFrame(f);an.getByteFrequencyData(fd);x.clearRect(0,0,c.width,c.height);let bc=64,bw=c.width/bc;for(let i=0;i<bc;i++){let idx=Math.floor(Math.pow(i/bc,1.2)*fd.length),val=fd[idx],h=val/255*c.height*0.9;x.fillStyle=i<20?'#ff0066':'#00ff88';x.fillRect(i*bw,c.height-h,bw-2,h)}})()}
</script></body></html>
